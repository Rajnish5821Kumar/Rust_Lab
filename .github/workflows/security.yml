name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, to catch newly published advisories

permissions:
  contents: read

jobs:
  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [backend, cli]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      # Editable install so --skip-editable excludes our own (unpublished) package
      # and only third-party dependencies are audited.
      - run: pip install -e ./${{ matrix.package }}
      - name: pip-audit
        run: pip-audit --skip-editable

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  bandit:
    name: Static analysis (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install bandit
      - run: bandit -r backend/app cli/devvault_cli -ll

  secrets:
    name: Committed secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --verbose
